name: Bug report
description: Report a problem in the NLUO redesign concept.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue clearly.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows 11
